name: Update Insights

on:
  schedule:
    - cron: '0 2 * * 1'  # 每周一凌晨2点（UTC）
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'build-all'
        type: choice
        options:
          - sync-only
          - build-all

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode || 'build-all' }}"
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "运行模式: $MODE"

      - name: Sync Feishu data
        if: steps.mode.outputs.mode != 'generate-insights'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
        run: |
          python scripts/fetch_feishu.py
          python scripts/normalize_records.py

      - name: Data quality audit
        if: steps.mode.outputs.mode != 'generate-insights'
        run: python scripts/audit_data_quality.py

      - name: Build evidence cards and clusters
        if: steps.mode.outputs.mode != 'generate-insights'
        run: |
          python scripts/build_evidence_cards.py
          python scripts/build_evidence_clusters.py

      - name: Validate three topics
        run: python scripts/validate_three_topics.py

      - name: Generate insight files
        run: python scripts/generate_insight_files.py

      - name: Build data.js
        run: python scripts/build_data_js.py

      - name: Validate output
        run: python scripts/validate_output.py

      - name: Check for changes
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/public/ assets/data.js
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "数据无变化，跳过提交"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "发现数据变化"
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git commit -m "data: auto-update insights and literature [skip ci]"
          git push

      - name: Setup Pages
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/deploy-pages@v4
