name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build data.js from committed JSON
        run: python scripts/build_data_js.py

      - name: Validate output
        run: python scripts/validate_output.py

      - name: Check for sensitive data
        run: |
          echo "检查公开目录是否包含敏感信息..."
          if grep -rn "app_id\|app_secret\|api_key\|FEISHU_APP\|DEEPSEEK" data/public/ --include="*.json" -i 2>/dev/null | grep -v "china_evidence\|token_type\|evidence_type" | head -5; then
            echo "⚠️ 发现潜在敏感关键词，请人工确认"
          else
            echo "✅ 未发现敏感信息"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
