name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Feishu data
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
        run: |
          python scripts/fetch_feishu.py
          python scripts/normalize_records.py

      - name: Data quality audit
        run: python scripts/audit_data_quality.py

      - name: Build evidence cards and clusters
        run: |
          python scripts/build_evidence_cards.py
          python scripts/build_evidence_clusters.py

      - name: Validate three topics
        run: python scripts/validate_three_topics.py

      - name: Generate insight files
        run: python scripts/generate_insight_files.py

      - name: Build data.js
        run: python scripts/build_data_js.py

      - name: Validate output
        run: python scripts/validate_output.py

      - name: Check for sensitive data
        run: |
          echo "检查公开目录是否包含敏感信息..."
          if grep -r "app_id\|app_secret\|api_key\|token\|password" data/public/ --include="*.json" -i; then
            echo "❌ 发现潜在敏感信息！"
            exit 1
          fi
          echo "✅ 未发现敏感信息"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
